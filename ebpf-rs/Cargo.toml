[package]
name = "shesh-ebpf-aya"
version = "0.1.0"
edition = "2021"
description = "Shesh eBPF telemetry with Aya — read-only, for future system/performance sensing"

[dependencies]
aya = { version = "0.12", features = ["async_tokio"] }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "execve-tracer"
path = "src/main.rs"
